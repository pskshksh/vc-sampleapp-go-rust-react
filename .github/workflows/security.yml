name: Security

# Open-source security scanning across the whole repo.
#
# Design: every scanner runs and writes a MACHINE-READABLE report (JSON/SARIF),
# uploaded as an artifact. None of them hard-fail the pipeline. The final
# `security-summary` job downloads every report and parses it into ONE ranked,
# actionable table on the run's Job Summary page: severity, advisory/rule ID,
# affected package, the version to upgrade to, and file:line for code/secret
# findings — i.e. exactly what should be fixed.
#
# SARIF-capable scanners also upload to Security > Code scanning (requires code
# scanning enabled: free for public repos, GitHub Advanced Security for private).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC — catch newly disclosed CVEs

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Trivy: dependencies, leaked secrets, and misconfigurations across the repo.
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Trivy (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan → JSON (findings feed)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Trivy scan → SARIF (code scanning)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-trivy
          path: trivy.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Hadolint: lint all three Dockerfiles → JSON.
  # ---------------------------------------------------------------------------
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles → JSON
        continue-on-error: true
        run: |
          : > hadolint.parts
          for f in services/goapi/Dockerfile services/rscounter/Dockerfile js/Dockerfile; do
            docker run --rm -i hadolint/hadolint hadolint --no-fail --format json - < "$f" \
              | jq --arg f "$f" 'map(.file = $f)' >> hadolint.parts
          done
          jq -s 'add // []' hadolint.parts > hadolint.json
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-hadolint
          path: hadolint.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gitleaks: scan the git history for committed secrets → JSON.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks → JSON
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --report-format json --report-path /repo/gitleaks.json \
            --redact --exit-code 0 --no-banner
          [ -f gitleaks.json ] || echo '[]' > gitleaks.json
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-gitleaks
          path: gitleaks.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Semgrep: multi-language SAST using the public rule registry → SARIF.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Semgrep scan → SARIF
        continue-on-error: true
        run: semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-semgrep
          path: semgrep.sarif
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Go: govulncheck against the Go vulnerability database → JSON.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/goapi/go.mod
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck → JSON
        continue-on-error: true
        working-directory: services/goapi
        run: govulncheck -json ./... > "$GITHUB_WORKSPACE/govulncheck.json" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-govulncheck
          path: govulncheck.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Rust: cargo-audit (advisories) → JSON.
  # ---------------------------------------------------------------------------
  cargo-audit:
    name: cargo-audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit → JSON
        continue-on-error: true
        working-directory: services/rscounter
        run: cargo audit --json > "$GITHUB_WORKSPACE/cargo-audit.json" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-cargo-audit
          path: cargo-audit.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Rust: cargo-deny (advisories + licenses + sources) → JSON lines.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny → JSON lines
        continue-on-error: true
        working-directory: services/rscounter
        run: cargo deny --format json check advisories bans licenses sources 2> "$GITHUB_WORKSPACE/cargo-deny.jsonl" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-cargo-deny
          path: cargo-deny.jsonl
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JS: pnpm audit against the npm advisory database → JSON.
  # ---------------------------------------------------------------------------
  pnpm-audit:
    name: pnpm audit (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Run pnpm audit → JSON
        continue-on-error: true
        working-directory: js
        run: pnpm audit --json > "$GITHUB_WORKSPACE/pnpm-audit.json" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sec-report-pnpm-audit
          path: pnpm-audit.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Dependency review: risky dependency changes (PRs only) → SARIF-ish table.
  # (Its own PR annotations are the primary output; included here for parity.)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Global report: parse every scanner's output into one actionable table.
  # ---------------------------------------------------------------------------
  security-summary:
    name: Security summary
    if: always()
    needs:
      - trivy-fs
      - hadolint
      - gitleaks
      - semgrep
      - govulncheck
      - cargo-audit
      - cargo-deny
      - pnpm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: sec-report-*
          merge-multiple: true

      - name: Build actionable summary
        run: |
          set -euo pipefail
          cd reports 2>/dev/null || { echo "No reports produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          : > findings.jsonl

          # Normalize a severity string to CRITICAL/HIGH/MEDIUM/LOW/INFO.
          # Each tool's jq below emits already-normalized severities.

          # --- Trivy: dependency vulns, secrets, and Dockerfile/IaC misconfig ---
          if [ -f trivy.json ]; then
            jq -c '
              .Results[]? as $r | $r.Target as $t
              | ( ($r.Vulnerabilities[]? | {severity:.Severity, tool:"trivy", category:"dependency",
                    id:.VulnerabilityID, package:(.PkgName + "@" + (.InstalledVersion//"?")),
                    installed:(.InstalledVersion//""), fixed:(.FixedVersion//""),
                    title:(.Title // .Description // ""), url:(.PrimaryURL//"")}),
                  ($r.Misconfigurations[]? | {severity:.Severity, tool:"trivy", category:"dockerfile",
                    id:.ID, package:$t, installed:"", fixed:(.Resolution//""),
                    title:.Title, url:(.PrimaryURL//"")}),
                  ($r.Secrets[]? | {severity:(.Severity//"CRITICAL"), tool:"trivy", category:"secret",
                    id:.RuleID, package:($t + ":" + (.StartLine|tostring)), installed:"", fixed:"",
                    title:.Title, url:""}) )
            ' trivy.json >> findings.jsonl 2>/dev/null || true
          fi

          # --- govulncheck: Go stdlib / module vulns actually reachable ---
          if [ -f govulncheck.json ] && [ -s govulncheck.json ]; then
            jq -s -c '
              (map(select(.osv) | {(.osv.id): .osv.summary}) | add // {}) as $sum
              | map(select(.finding) | .finding)
              | map(select((.trace[0].module // "") != ""))
              | map({osv:.osv, module:.trace[0].module, ver:(.trace[0].version//""), fixed:(.fixed_version//"")})
              | unique_by(.osv)
              | .[] | {severity:"HIGH", tool:"govulncheck", category:"dependency",
                       id:.osv, package:(.module + "@" + .ver), installed:.ver, fixed:.fixed,
                       title:($sum[.osv] // ""), url:("https://pkg.go.dev/vuln/" + .osv)}
            ' govulncheck.json >> findings.jsonl 2>/dev/null || true
          fi

          # --- cargo-audit: RustSec advisories ---
          if [ -f cargo-audit.json ] && [ -s cargo-audit.json ]; then
            jq -c '
              .vulnerabilities.list[]? |
              {severity:"HIGH", tool:"cargo-audit", category:"dependency",
               id:.advisory.id, package:(.package.name + "@" + .package.version),
               installed:.package.version, fixed:((.versions.patched // []) | join(", ")),
               title:.advisory.title, url:(.advisory.url // ("https://rustsec.org/advisories/" + .advisory.id))}
            ' cargo-audit.json >> findings.jsonl 2>/dev/null || true
          fi

          # --- cargo-deny: license/advisory/source policy diagnostics ---
          if [ -f cargo-deny.jsonl ] && [ -s cargo-deny.jsonl ]; then
            jq -c 'select(.type=="diagnostic") | .fields |
              {severity:((.severity // "warning") | ascii_upcase | if .=="ERROR" then "HIGH" elif .=="WARNING" then "MEDIUM" else "LOW" end),
               tool:"cargo-deny", category:"license", id:(.code.code // .code // "policy"),
               package:"", installed:"", fixed:"", title:(.message // ""), url:""}
            ' cargo-deny.jsonl >> findings.jsonl 2>/dev/null || true
          fi

          # --- pnpm audit: npm advisories ---
          if [ -f pnpm-audit.json ] && [ -s pnpm-audit.json ]; then
            jq -c '
              (.advisories // {}) | to_entries[] | .value |
              {severity:((.severity // "moderate") | ascii_upcase | if .=="MODERATE" then "MEDIUM" else . end),
               tool:"pnpm-audit", category:"dependency", id:(.github_advisory_id // (.cves[0]?) // (.id|tostring)),
               package:.module_name, installed:"", fixed:(.patched_versions // ""),
               title:.title, url:(.url // "")}
            ' pnpm-audit.json >> findings.jsonl 2>/dev/null || true
          fi

          # --- Semgrep: SAST findings ---
          if [ -f semgrep.sarif ] && [ -s semgrep.sarif ]; then
            jq -c '
              .runs[]?.results[]? |
              {severity:(((.properties.severity // .level) // "warning") | ascii_upcase
                         | if .=="ERROR" then "HIGH" elif .=="WARNING" then "MEDIUM" elif .=="INFO" or .=="NOTE" then "LOW" else . end),
               tool:"semgrep", category:"code", id:.ruleId,
               package:((.locations[0].physicalLocation.artifactLocation.uri // "?") + ":" +
                        ((.locations[0].physicalLocation.region.startLine // 0)|tostring)),
               installed:"", fixed:"", title:(.message.text // ""), url:""}
            ' semgrep.sarif >> findings.jsonl 2>/dev/null || true
          fi

          # --- Hadolint: Dockerfile findings ---
          if [ -f hadolint.json ] && [ -s hadolint.json ]; then
            jq -c '
              .[]? |
              {severity:((.level // "warning") | ascii_upcase
                         | if .=="ERROR" then "HIGH" elif .=="WARNING" then "MEDIUM" else "LOW" end),
               tool:"hadolint", category:"dockerfile", id:.code,
               package:(.file + ":" + (.line|tostring)), installed:"", fixed:"",
               title:.message, url:("https://github.com/hadolint/hadolint/wiki/" + .code)}
            ' hadolint.json >> findings.jsonl 2>/dev/null || true
          fi

          # --- Gitleaks: leaked secrets ---
          if [ -f gitleaks.json ] && [ -s gitleaks.json ]; then
            jq -c '
              .[]? |
              {severity:"CRITICAL", tool:"gitleaks", category:"secret", id:.RuleID,
               package:(.File + ":" + ((.StartLine // 0)|tostring)), installed:"", fixed:"",
               title:(.Description // "secret detected"), url:""}
            ' gitleaks.json >> findings.jsonl 2>/dev/null || true
          fi

          # ---------------------------------------------------------------------
          # Render the Job Summary.
          # ---------------------------------------------------------------------
          total=$(wc -l < findings.jsonl | tr -d ' ')

          sev_count() { jq -r --arg s "$1" '[select(.severity==$s)]|length' findings.jsonl 2>/dev/null | awk '{n+=$1} END{print n+0}'; }
          C=$(jq -rs '[.[]|select(.severity=="CRITICAL")]|length' findings.jsonl 2>/dev/null || echo 0)
          H=$(jq -rs '[.[]|select(.severity=="HIGH")]|length' findings.jsonl 2>/dev/null || echo 0)
          M=$(jq -rs '[.[]|select(.severity=="MEDIUM")]|length' findings.jsonl 2>/dev/null || echo 0)
          L=$(jq -rs '[.[]|select(.severity=="LOW")]|length' findings.jsonl 2>/dev/null || echo 0)

          {
            echo "## 🔒 Security findings"
            echo ""
            echo "**Total:** ${total:-0} &nbsp;·&nbsp; 🔴 Critical: ${C:-0} &nbsp; 🟠 High: ${H:-0} &nbsp; 🟡 Medium: ${M:-0} &nbsp; ⚪ Low: ${L:-0}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Table 1 — dependencies to upgrade (the most directly fixable).
          jq -rs '
            def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}[.]//5;
            def esc: (.//"")|tostring|gsub("[|]";"\\|")|gsub("\n";" ")|.[0:90];
            map(select(.category=="dependency")) | sort_by(.severity|rank) | .[]
            | "| \(.severity) | \(.package|esc) | \(if (.fixed|tostring)=="" then "⚠️ no fix yet" else (.fixed|esc) end) | [\(.id|esc)](\(.url)) | \(.tool) |"
          ' findings.jsonl > deps.md 2>/dev/null || true

          {
            echo "### 📦 Dependencies to upgrade"
            echo ""
            if [ -s deps.md ]; then
              echo "| Severity | Package (installed) | Fix → version | Advisory | Scanner |"
              echo "| --- | --- | --- | --- | --- |"
              cat deps.md
            else
              echo "_No vulnerable dependencies reported._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Table 2 — code / secret / Dockerfile / license findings.
          jq -rs '
            def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}[.]//5;
            def esc: (.//"")|tostring|gsub("[|]";"\\|")|gsub("\n";" ")|.[0:90];
            map(select(.category!="dependency")) | sort_by(.severity|rank) | .[]
            | "| \(.severity) | \(.category) | \(.tool) | \(.id|esc) | \(.package|esc) | \(.title|esc) |"
          ' findings.jsonl > code.md 2>/dev/null || true

          {
            echo "### 🔎 Code, secrets & Dockerfile findings"
            echo ""
            if [ -s code.md ]; then
              echo "| Severity | Type | Scanner | Rule/ID | Location | Detail |"
              echo "| --- | --- | --- | --- | --- | --- |"
              cat code.md
            else
              echo "_No code, secret, or Dockerfile findings reported._"
            fi
            echo ""
            echo "> Scans are **reported, not blocking**. Fix items top-down (Critical → Low)."
            echo "> To fail the run on findings, change the summary's \`exit 0\` to \`exit 1\` when \`total\` > 0."
          } >> "$GITHUB_STEP_SUMMARY"

          # Also drop the raw normalized findings as an artifact-friendly file.
          cp findings.jsonl "$GITHUB_WORKSPACE/findings.jsonl" 2>/dev/null || true

      - name: Upload normalized findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: findings.jsonl
          if-no-files-found: ignore
